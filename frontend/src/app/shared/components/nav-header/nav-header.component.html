<header class="nav-header">
  <div class="nav-header__grid">
    <div class="nav-header__left">
      <button
        class="nav-header__menu"
        type="button"
        (click)="openMenu()"
        [attr.aria-label]="'nav.main' | t"
      >
        <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
      </button>

      <nav class="nav-header__group nav-header__group--left" aria-label="Navegaci��n principal izquierda">
        @for (link of links.slice(0, 2); track link.route) {
          <a
            class="nav-header__link"
            [routerLink]="link.route"
            routerLinkActive="is-active"
          >{{ link.label }}</a>
        }
      </nav>
    </div>

    <a class="nav-header__logo-link" routerLink="/home" aria-label="Ir al inicio">
      <img
        class="nav-header__logo"
        src="assets/img/brand/seven-logo-principal.png"
        alt="SEVEN"
        width="160"
        height="54"
        loading="eager"
        fetchpriority="high"
      />
    </a>

    <div class="nav-header__right">
      <nav class="nav-header__group nav-header__group--right" aria-label="Navegaci��n principal derecha">
        @for (link of links.slice(2, 4); track link.route) {
          <a
            class="nav-header__link"
            [routerLink]="link.route"
            routerLinkActive="is-active"
          >{{ link.label }}</a>
        }
      </nav>

      <button class="nav-header__search" type="button" (click)="openSearch()" aria-label="Buscar en la isla">
        <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
        <span class="nav-header__search-label">Buscar</span>
      </button>
    </div>
  </div>
</header>
