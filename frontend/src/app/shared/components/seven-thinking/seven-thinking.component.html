<div class="think" role="status" aria-live="polite">
  <div class="think__head">
    <span class="think__pulse" aria-hidden="true">
      <ion-icon name="sparkles-outline"></ion-icon>
    </span>
    <span class="think__label">{{ 'assistant.thinking' | t }}</span>
  </div>

  <div class="think__skeletons" aria-hidden="true">
    <span class="think__card">
      <span class="think__media"></span>
      <span class="think__lines">
        <span class="think__line think__line--short"></span>
        <span class="think__line"></span>
      </span>
    </span>
    <span class="think__card">
      <span class="think__media"></span>
      <span class="think__lines">
        <span class="think__line think__line--short"></span>
        <span class="think__line"></span>
      </span>
    </span>
  </div>
</div>
