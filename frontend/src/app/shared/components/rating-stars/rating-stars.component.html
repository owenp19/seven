<div class="rating">
  <div class="rating__stars" [attr.aria-label]="'Calificación ' + rating + ' de 5'">
    @for (star of stars; track star; let index = $index) {
      <ion-icon [name]="star === 'full' ? 'star' : star === 'half' ? 'star-half' : 'star-outline'" [class.rating__icon--active]="star !== 'empty'" aria-hidden="true"></ion-icon>
    }
  </div>

  @if (showCount && count > 0) {
    <span class="rating__value">
      {{ rating.toLocaleString('es-CO', { maximumFractionDigits: 1 }) }}
      <span class="rating__count">({{ count }})</span>
    </span>
  } @else if (showCount) {
    <span class="rating__value">Nuevo</span>
  }
</div>
