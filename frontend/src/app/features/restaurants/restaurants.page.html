<app-page-header [title]="'catalog.restaurants.title' | t" defaultHref="/home"></app-page-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle-outline"
      refreshingSpinner="crescent"
      [pullingText]="'common.pullToRefresh' | t"
      [refreshingText]="'common.refreshing' | t"
    ></ion-refresher-content>
  </ion-refresher>

  @if (restaurants$ | async) {
    <div class="catalog">
      <div class="catalog__intro">
        <p class="catalog__subtitle">{{ 'catalog.restaurants.subtitle' | t }}</p>
      </div>

      <label class="catalog__search">
        <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
        <input
          type="search"
          inputmode="search"
          autocomplete="off"
          [value]="query()"
          (input)="onSearch($event)"
          [placeholder]="'catalog.searchPlaceholder' | t"
          [attr.aria-label]="'catalog.searchLabel' | t"
        />
        @if (query()) {
          <button
            type="button"
            class="catalog__search-clear"
            [attr.aria-label]="'catalog.clearSearch' | t"
            (click)="clearSearch()"
          >
            <ion-icon name="close-circle" aria-hidden="true"></ion-icon>
          </button>
        }
      </label>

      <div class="catalog__grid">
        @for (item of filtered(); track item.id) {
          <app-seven-result-card
            variant="grid"
            [image]="item.cover"
            [name]="item.name"
            [category]="item.category ?? 'Gastronomía'"
            [description]="item.description"
            [rating]="item.rating"
            [ratingCount]="item.reviews"
            [link]="'/restaurant/' + item.slug"
            [alt]="item.name"
          ></app-seven-result-card>
        } @empty {
          <div class="catalog__state">
            <ion-icon [name]="query() ? 'search-outline' : 'restaurant-outline'" aria-hidden="true"></ion-icon>
            @if (query()) {
              <h2>{{ 'catalog.noResultsTitle' | t }}</h2>
              <p>{{ 'catalog.noResultsHint' | t }}</p>
              <button type="button" class="catalog__state-action" (click)="clearSearch()">
                {{ 'catalog.clearFilters' | t }}
              </button>
            } @else {
              <h2>{{ 'catalog.restaurants.empty' | t }}</h2>
            }
          </div>
        }
      </div>
    </div>
  } @else {
    <app-seven-context-loader variant="list" type="restaurant"></app-seven-context-loader>
  }
</ion-content>
